<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Osmadvacítka – route</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  header { padding: 12px 16px; font-weight: 700; font-size: 18px; }
  main { padding: 0 16px 96px; max-width: 640px; margin: 0 auto; }
  [hidden] { display: none !important; }
  .pub { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #8884; }
  .pub input { width: 24px; height: 24px; flex: none; }
  .pub b { display: inline-block; min-width: 1.8em; }
  small { opacity: .7; display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: Canvas; border-top: 1px solid #8884; display: flex; gap: 8px; }
  button, .btn { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid #8886; background: ButtonFace; color: ButtonText; text-decoration: none; cursor: pointer; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; flex: 1; font-weight: 600; }
  button:disabled { opacity: .45; }
  #map { height: 45vh; margin: 0 -16px; }
  .sum { padding: 12px 0; font-weight: 600; }
  .leg h3 button { padding: 4px 12px; }
  details { padding: 12px 0; } summary { cursor: pointer; padding: 8px 0; }
  #table { overflow-x: auto; } table { border-collapse: collapse; font-size: 13px; }
  td, th { padding: 4px 6px; text-align: right; border: 1px solid #8884; }
  .w { color: #1a73e8; } .t { color: #d93025; }
  .leg { padding: 12px 0; border-bottom: 1px solid #8884; }
  .leg.done { opacity: .45; }
  .leg h3 { margin: 0 0 4px; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
  .leg h3 span { flex: 1; }
  .mode { font-weight: 600; }
  .mode.walk { color: #1a73e8; } .mode.transit { color: #d93025; }
  .opt { margin-top: 8px; padding-left: 8px; border-left: 3px solid #8884; }
  .opt.best { border-left-color: currentColor; }
  .opt a { margin-left: 8px; font-size: 14px; }
  .leg ol { margin: 6px 0; padding-left: 20px; font-size: 14px; }
  .leg .row { display: flex; gap: 8px; margin-top: 8px; }
  .leg .row > * { padding: 8px 12px; font-size: 14px; }
  label.min { display: block; padding: 12px 0; }
  label.min input { width: 4em; font: inherit; padding: 6px; }
  #msg { padding: 12px 0; color: #d93025; }
</style>
</head>
<body>
<header>28° Osmadvacítka</header>
<main>
  <section id="draw">
    <p>Tick the 8 drawn pubs. Jamajka and Petřín are added automatically.</p>
    <div id="list"></div>
    <label class="min">Minutes spent in each pub <input id="pubMin" type="number" min="0" max="60" value="10" inputmode="numeric"></label>
    <div class="bar"><button class="primary" id="plan" disabled>Plan route (0/8)</button></div>
  </section>
  <div id="map" hidden></div>
  <div id="msg" role="alert"></div>
  <section id="planv" hidden>
    <div id="summaryP" class="sum" aria-live="polite"></div>
    <div id="hops"></div>
    <details><summary>All times between stops (min)</summary><div id="table"></div>
      <small>Times are precomputed for Friday 19:00; locking in fetches live routes. Rows = from, columns = to. Blue = walking is faster, red = public transport. S start, X Jamajka, P Petřín.</small></details>
    <div class="bar">
      <button id="suggest">Suggest best</button>
      <button class="primary" id="lock">Lock in</button>
    </div>
  </section>
  <section id="route" hidden>
    <div id="summary" class="sum" aria-live="polite"></div>
    <div id="legs"></div>
    <div class="bar">
      <button class="primary" id="replan">Re-plan</button>
      <button id="share">Share</button>
      <button id="reset">New draw</button>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
// [sheet number, name, address, beer, lat, lng] – geocoded once, hardcoded on purpose
const PUBS = [
  [1, 'Branická Formanka', 'Vodičkova 26', 'Braník 10', 50.0803262, 14.423935],
  [2, 'U Dvou Koček', 'Uhelný trh 10', 'Plzeň nebo Kočka', 50.0836408, 14.4204633],
  [3, 'V Koutku', 'Elišky Peškové 3', 'Staráč 10', 50.0771868, 14.4052225],
  [4, 'U Váhy', 'Nádražní 88', 'Plzeň', 50.0690193, 14.4062849],
  [5, 'U Rotundy', 'Karolíny Světlé 17', 'Staráč 10', 50.0825898, 14.4145014],
  [6, 'Konírna', 'Anenská 11', 'Bernard 10', 50.0854874, 14.4157084],
  [7, 'U Staré Pošty', 'Opletalova 17', 'Gambáč 12 nebo Plzeň', 50.0825941, 14.4311598],
  [8, 'U Starého Lva', 'Lidická 13', 'Staráč 10 nebo Rohozec 10', 50.0724274, 14.4086505],
  [9, 'U Kalendů', 'Rašínovo nábřeží 58', 'Plzeň', 50.0712819, 14.4144453],
  [10, 'Brouk', 'Vltavská 22', 'Radek nebo Plzeň', 50.0698476, 14.40688],
  [11, 'U Rudolfina', 'Křížovnická 10', 'Plzeň', 50.0880561, 14.4155471],
  [12, 'Techno Bar', 'Vratislavova 1', 'Páter 11 nebo Plzeň', 50.0672177, 14.4173677],
  [13, 'U Libuše', 'Podskalská 7', 'Staráč 10 nebo Bráník 11', 50.06869, 14.4155556],
  [14, 'U Suché Dásně', 'Trojická 11', 'Radek nebo Plzeň', 50.07081, 14.4163144],
  [15, 'Knoflík', 'Bozděchova 3', 'Staráč 10', 50.0702505, 14.4046856],
  [16, 'U Olmerů', 'Slavojova 16', 'Min 10', 50.0637582, 14.4253144],
  [17, 'U Templáře', 'Masná 17', 'Gambáč 11 nebo Plzeň', 50.0897644, 14.4251094],
  [18, 'Hospůdka Na Hradbách', 'V Pevnosti 144', 'Min 10', 50.0636012, 14.4220077],
  [19, 'Billiard klub Albertov', 'Na Slupi 3', 'Chodovar 10', 50.0671482, 14.42131],
  [20, 'U Žaludů', 'Na Zbořenci 5', 'Min 10', 50.0773088, 14.4171375],
].map(([id, n, a, b, lat, lng]) => ({ id, n, a, b, lat, lng }));
const START = { id: 'S', n: 'Palackého náměstí', lat: 50.0732449, lng: 14.4145186 };
const JAM = { id: 'X', n: 'Jamajka', a: 'Staropramenná 2', b: 'Min 10', lat: 50.0697855, lng: 14.4073846 };
const PET = { id: 'P', n: 'Petřín – rozhledna', a: 'lahváč', b: 'Min 10', lat: 50.083527, lng: 14.3950837 };
const pub = id => PUBS.find(p => p.id == id);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ll = p => ({ lat: p.lat, lng: p.lng });
const mins = s => Math.round(s / 60) + ' min';
const hhmm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const store = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

let order = [];                 // pub ids in visiting order
let done = load('done', []);    // ids already visited (pub ids and 'X')
let map, overlays = [], me, mePos, runId = 0;

// ---------- draw view ----------
$('list').innerHTML = PUBS.map(p =>
  `<label class="pub"><input type="checkbox" value="${p.id}"><span><b>${p.id}</b> ${esc(p.n)}<small>${esc(p.a)} · ${esc(p.b)}</small></span></label>`).join('');
const boxes = [...document.querySelectorAll('#list input')];
const picked = () => boxes.filter(b => b.checked).map(b => +b.value);
$('list').onchange = () => {
  const n = picked().length;
  $('plan').disabled = n !== 8;
  $('plan').textContent = `Plan route (${n}/8)`;
};
$('pubMin').value = load('pubMin', 10);
$('pubMin').onchange = () => store('pubMin', +$('pubMin').value);
$('plan').onclick = () => { done = []; store('done', done); startPlan(START, picked()); };
$('reset').onclick = () => {
  if (!confirm('Start a new draw? The current route is dropped.')) return;
  done = []; store('done', undefined); history.replaceState(null, '', location.pathname);
  view('draw');
};
$('share').onclick = () => navigator.share ? navigator.share({ title: document.title, url: location.href }).catch(() => {})
  : navigator.clipboard.writeText(location.href).then(() => alert('Link copied'));
$('replan').onclick = () => startPlan(mePos ? { id: 'me', n: 'You', ...mePos } : lastStop(), order.filter(id => !done.includes(id)));
$('suggest').onclick = () => { plan.ids = optimize(); renderPlan(); };
$('lock').onclick = () => {
  order = [...order.filter(id => done.includes(id)), ...plan.ids];
  view('route'); run(plan.origin);
};
const lastStop = () => { const l = done.at(-1); return l === 'X' ? JAM : l ? pub(l) : START; };

function view(name) {
  for (const v of ['draw', 'planv', 'route']) $(v).hidden = v !== name;
  $('map').hidden = name === 'draw';
  $('msg').textContent = '';
  if (name === 'draw' || map) return;
  map = new google.maps.Map($('map'), { center: ll(START), zoom: 14, mapTypeControl: false, streetViewControl: false, fullscreenControl: false });
  navigator.geolocation?.watchPosition(p => {
    mePos = { lat: p.coords.latitude, lng: p.coords.longitude };
    me ??= new google.maps.Marker({ map, zIndex: 999, title: 'You', icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#1a73e8', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3 } });
    me.setPosition(mePos);
  }, () => {}, { enableHighAccuracy: true });
}
function draw(points, labels, lines) {   // pins + lines on the shared map
  overlays.forEach(o => o.setMap(null)); overlays = [];
  const bounds = new google.maps.LatLngBounds();
  points.forEach((p, i) => { overlays.push(new google.maps.Marker({ map, position: ll(p), label: labels[i], title: p.n })); bounds.extend(ll(p)); });
  lines.forEach(l => overlays.push(new google.maps.Polyline({ map, strokeWeight: 5, strokeOpacity: .8, ...l })));
  map.fitBounds(bounds, 40);
}

// ---------- planning: times between every pair, order by hand or by machine ----------
let plan;   // { origin, ids, tail, from, to, w: {a: {b: {s, m}}}, t: {a: {b: s}} }
async function matrix(mode, from, to) {
  const r = await new google.maps.DistanceMatrixService().getDistanceMatrix({
    origins: from.map(ll), destinations: to.map(ll), travelMode: mode, transitOptions: { departureTime: new Date() },
  });
  return Object.fromEntries(r.rows.map((row, i) => [from[i].id, Object.fromEntries(row.elements.map((e, j) =>
    [to[j].id, e.status === 'OK' ? { s: e.duration.value, m: e.distance.value } : { s: Infinity, m: 0 }]))]));
}
const hop = (a, b) => Math.min(plan.w[a][b].s, plan.t[a][b].s);
async function startPlan(origin, ids) {
  const my = ++runId;
  view('planv');
  $('summaryP').textContent = 'Loading times…'; $('hops').innerHTML = $('table').innerHTML = '';
  try {
    const pubs = ids.map(pub), tail = done.includes('X') ? [PET] : [JAM, PET];
    const from = [origin, ...pubs, ...tail.slice(0, -1)], to = [...pubs, ...tail];
    // stored times cover start + all pubs; only a GPS origin needs a live lookup (one row)
    const w = { ...TIMES.w }, t = { ...TIMES.t };
    if (origin.id === 'me') {
      try { [w.me, t.me] = (await Promise.all(['WALKING', 'TRANSIT'].map(m => matrix(m, [origin], to)))).map(r => r.me); }
      catch { return startPlan(lastStop(), ids).then(() => { $('msg').textContent = 'Live lookup from your position failed; planning from the last finished stop instead.'; }); }
    }
    if (my !== runId) return;
    plan = { origin, ids, tail, from, to, w, t };
    plan.ids = optimize();
    renderPlan();
  } catch (e) { $('summaryP').textContent = ''; $('msg').textContent = 'Loading times failed: ' + (e.message || e); }
}
function optimize() {   // brute force, 8! = 40,320 orders
  const ids = plan.ids, n = ids.length, end = plan.tail[0].id;
  let best = Infinity, bestPath = ids;
  const path = [], used = Array(n).fill(false);
  (function go(at, cost) {
    if (cost >= best) return;
    if (path.length === n) { cost += hop(at, end); if (cost < best) { best = cost; bestPath = [...path]; } return; }
    for (let k = 0; k < n; k++) if (!used[k]) { used[k] = true; path.push(ids[k]); go(ids[k], cost + hop(at, ids[k])); path.pop(); used[k] = false; }
  })(plan.origin.id, 0);
  return bestPath;
}
const km = m => m < 1000 ? m + ' m' : (m / 1000).toFixed(1) + ' km';
function renderPlan() {
  const seq = [plan.origin, ...plan.ids.map(pub), ...plan.tail], n = plan.ids.length;
  let total = 0, html = '';
  for (let i = 1; i < seq.length; i++) {
    const a = seq[i - 1], b = seq[i], w = plan.w[a.id][b.id], t = plan.t[a.id][b.id].s, walk = w.s <= t;
    total += Math.min(w.s, t);
    const mv = i <= n ? `<button data-mv="${i - 1},-1" aria-label="Move ${esc(b.n)} earlier" ${i === 1 ? 'disabled' : ''}>↑</button>
      <button data-mv="${i - 1},1" aria-label="Move ${esc(b.n)} later" ${i === n ? 'disabled' : ''}>↓</button>` : '';
    html += `<div class="leg"><h3><span>${i}. ${esc(b.n)} <small style="display:inline">(${b.id})</small></span>${mv}</h3>
      <small>from ${esc(a.n)}</small>
      <div><span class="${walk ? 'mode walk' : ''}">walk ${mins(w.s)} · ${km(w.m)}</span> &nbsp;
      <span class="${walk ? '' : 'mode transit'}">transit ${isFinite(t) ? mins(t) : '–'}</span></div></div>`;
  }
  $('hops').innerHTML = html;
  const pubMin = (+$('pubMin').value || 0) * 60 * (seq.length - 2);
  $('summaryP').textContent = `${mins(total)} travelling · finish about ${hhmm(Date.now() + (total + pubMin) * 1000)}`;
  $('table').innerHTML = `<table><tr><th></th>${plan.to.map(b => `<th>${b.id}</th>`).join('')}</tr>${plan.from.map(a =>
    `<tr><th>${a.id === 'me' ? '•' : a.id}</th>${plan.to.map(b => a.id === b.id ? '<td></td>'
      : `<td class="${plan.w[a.id][b.id].s <= plan.t[a.id][b.id].s ? 'w' : 't'}">${Math.round(hop(a.id, b.id) / 60)}</td>`).join('')}</tr>`).join('')}</table>`;
  draw(seq, seq.map((p, i) => i ? String(p.id) : (p.id === 'S' ? 'S' : '•')), [{ path: seq.map(ll), strokeColor: '#666', strokeWeight: 3 }]);
}
$('hops').onclick = e => {
  if (!e.target.dataset.mv) return;
  const [i, d] = e.target.dataset.mv.split(',').map(Number), ids = plan.ids;
  [ids[i], ids[i + d]] = [ids[i + d], ids[i]];
  renderPlan();
};

// ---------- routing: every leg shows the walk and the next connections ----------
let routeOrigin = START;
const stopById = id => id === 'S' ? START : id === 'X' ? JAM : id === 'P' ? PET : id === 'me' ? routeOrigin : pub(id);
async function directions(a, b, mode, t) {   // -> list of options, soonest arrival first
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const r = await new google.maps.DirectionsService().route({ origin: ll(a), destination: ll(b), travelMode: mode,
        transitOptions: { departureTime: new Date(t) }, provideRouteAlternatives: mode === 'TRANSIT' });
      return r.routes.map(x => {
        const leg = x.legs[0];
        return { leg, path: x.overview_path, transit: leg.steps.some(st => st.travel_mode === 'TRANSIT'),
          secs: leg.arrival_time ? (leg.arrival_time.value - t) / 1000 : leg.duration.value };   // transit: include the wait
      }).filter(o => o.transit === (mode === 'TRANSIT')).sort((x, y) => x.secs - y.secs);
    } catch (e) {
      if (e.code !== 'OVER_QUERY_LIMIT') return [];
      await new Promise(r => setTimeout(r, 1500));
    }
  }
  return [];
}
const stepText = s => s.travel_mode === 'TRANSIT'
  ? `${esc(s.transit.line.vehicle.name)} <b>${esc(s.transit.line.short_name || s.transit.line.name)}</b> towards ${esc(s.transit.headsign || '')}: <b>${esc(s.transit.departure_time.text)}</b> ${esc(s.transit.departure_stop.name)} → ${esc(s.transit.arrival_time.text)} ${esc(s.transit.arrival_stop.name)} (${s.transit.num_stops} stops)`
  : `Walk ${esc(s.duration.text)} · ${esc(s.distance.text)}`;
async function legBody(a, b, t) {
  const [walks, rides] = await Promise.all(['WALKING', 'TRANSIT'].map(m => directions(a, b, m, t)));
  const walk = walks[0], best = [walk, rides[0]].filter(Boolean).sort((x, y) => x.secs - y.secs)[0];
  const gm = `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=`;
  let html = best ? `<small>leaving ${hhmm(t)} · fastest gets there ${hhmm(t + best.secs * 1000)}</small>` : '<small>No route found.</small>';
  if (walk) html += `<div class="opt${best === walk ? ' best' : ''}"><span class="mode walk">Walk · ${mins(walk.secs)} · ${esc(walk.leg.distance.text)}</span>
    <a target="_blank" rel="noopener" href="${gm}walking">map</a></div>`;
  rides.slice(0, 3).forEach(r => html += `<div class="opt${best === r ? ' best' : ''}"><span class="mode transit">Public transport · there in ${mins(r.secs)} (${hhmm(t + r.secs * 1000)})</span>
    <a target="_blank" rel="noopener" href="${gm}transit">map</a><ol>${r.leg.steps.map(x => `<li>${stepText(x)}</li>`).join('')}</ol></div>`);
  if (!rides.length) html += '<div class="opt"><small>No public transport connection found.</small></div>';
  return { html, best };
}
async function run(origin) {
  const my = ++runId;
  routeOrigin = origin;
  $('summary').textContent = 'Routing…'; $('legs').innerHTML = '';
  try {
    const visited = order.filter(id => done.includes(id)), todo = order.filter(id => !done.includes(id));
    history.replaceState(null, '', '#' + order.join(','));
    const stops = [...todo.map(pub), ...(done.includes('X') ? [] : [JAM]), PET];
    const pubMin = (+$('pubMin').value || 0) * 60000;  // ms
    const labels = [origin.id === 'S' ? 'S' : '•'], lines = [];
    let t = Date.now(), prev = origin, travel = 0, html = '';
    for (const [i, s] of stops.entries()) {
      const { html: body, best } = await legBody(prev, s, t);
      if (my !== runId) return;
      const label = s.id === 'P' ? '🏁' : String(visited.length + i + 1);
      labels.push(label);
      if (best) { lines.push({ path: best.path, strokeColor: best.transit ? '#d93025' : '#1a73e8' }); t += best.secs * 1000; travel += best.secs; }
      html += `<div class="leg" data-a="${prev.id}" data-b="${s.id}"><h3><span>${label}. ${esc(s.n)}</span></h3>
        <small>${esc(s.a)} · ${esc(s.b)} · from ${esc(prev.n)}</small><div class="body">${body}</div>
        <div class="row">${s.id === 'P' ? '' : `<button data-done="${s.id}">Done</button>`}<button data-refresh>Next connections now</button></div></div>`;
      if (s.id !== 'P') t += pubMin;
      prev = s;
    }
    $('legs').innerHTML = html;
    $('summary').textContent = `${mins(travel)} travelling · finish at Petřín about ${hhmm(t)}`;
    draw([origin, ...stops], labels, lines);
  } catch (e) {
    $('summary').textContent = '';
    $('msg').textContent = 'Routing failed: ' + (e.message || e);
  }
}
async function refresh(leg) {   // look the leg up again, leaving right now
  const body = leg.querySelector('.body');
  body.innerHTML = '<small>Looking up…</small>';
  body.innerHTML = (await legBody(stopById(leg.dataset.a), stopById(leg.dataset.b), Date.now())).html;
}
$('legs').onclick = e => {
  const leg = e.target.closest('.leg');
  if (e.target.dataset.refresh !== undefined) return refresh(leg);
  const id = e.target.dataset.done;
  if (!id) return;
  done.push(id === 'X' ? 'X' : +id); store('done', done);
  leg.classList.add('done'); e.target.remove();
  if (leg.nextElementSibling) refresh(leg.nextElementSibling);   // beer finished: show what leaves now
};

// ---------- boot ----------
window.init = () => {
  const ids = location.hash.slice(1).split(',').map(Number).filter(pub);
  if (new Set(ids).size !== 8) { done = []; return; }
  order = ids;
  done = done.filter(id => id === 'X' || ids.includes(id));
  view('route');
  run(lastStop());
};
const s = document.createElement('script');
s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(window.GOOGLE_MAPS_KEY || '')}&v=weekly&loading=async&callback=init`;
s.onerror = () => { document.querySelector('main').textContent = 'Google Maps failed to load.'; };
document.head.append(s);
</script>
</body>
</html>
